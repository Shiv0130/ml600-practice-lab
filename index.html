<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04aa6d">
<title>ML600 Practice Lab</title>
<script>try{var t=localStorage.getItem("ml600lab.theme");if(/^(light|dark|dracula|futuristic|solarized|contrast)$/.test(t)){var d=document.documentElement;d.setAttribute("data-theme",t);d.style.backgroundColor={light:"#f1f3f6",dark:"#0f141a",dracula:"#21222c",futuristic:"#05060d",solarized:"#eee8d5",contrast:"#000000"}[t]}}catch(e){}</script>
<style>*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;--hh:58px}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg-f1f3f6,#f1f3f6);color:var(--fg-1f2933,#1f2933);line-height:1.5;overflow-x:hidden;font-size:16px;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;background:var(--bg-282a35,#282a35);color:var(--fg-fff,#fff);padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
#menuBtn{background:var(--bg-04aa6d,#04aa6d);color:var(--on-04aa6d,#fff);border:0;border-radius:8px;width:44px;height:44px;font-size:22px;flex:none}
.brand{color:var(--fg-fff,#fff);text-decoration:none;font-weight:700;font-size:16px;white-space:nowrap}.brand span{color:var(--fg-04aa6d,#04aa6d);font-weight:600}
.chips{margin-left:auto;display:flex;gap:4px;flex-wrap:nowrap}
.chip{background:var(--bg-3a3d4d,#3a3d4d);border-radius:14px;padding:3px 8px;font-size:12px;white-space:nowrap}.chip.warn{background:var(--bg-92400e,#92400e);color:var(--on-92400e,#fff)}.chip.ok{background:var(--bg-047857,#047857);color:var(--on-047857,#fff)}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
#nav{position:fixed;top:0;left:0;bottom:0;width:min(84vw,320px);background:var(--bg-fff,#fff);z-index:50;transform:translateX(-105%);transition:transform .2s;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 0 40px;padding-left:env(safe-area-inset-left);padding-top:max(10px,env(safe-area-inset-top));box-shadow:2px 0 12px rgba(0,0,0,.3)}
body.nav-open #nav{transform:none}body.nav-open #scrim{display:block}
#nav h6{margin:14px 14px 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-6b7280,#6b7280)}
#nav a{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 14px;color:var(--fg-1f2933,#1f2933);text-decoration:none;border-left:4px solid transparent;font-size:15px}
#nav a.active{background:var(--bg-e7f6ef,#e7f6ef);border-left-color:var(--bd-04aa6d,#04aa6d);font-weight:600}#nav a .tick{margin-left:auto;color:var(--fg-04aa6d,#04aa6d)}
@media(min-width:960px){#nav{transform:none;box-shadow:none;border-right:1px solid var(--bd-d9dde3,#d9dde3);top:var(--hh);width:290px;padding-top:10px}#menuBtn,#scrim{display:none!important}}
main{max-width:900px;padding:10px 12px 90px;margin-inline:auto}
@media(min-width:960px){main{max-width:920px;margin-left:calc(290px + max(16px,(100vw - 290px - 920px)/2));margin-right:16px;padding-top:16px}}
@media(min-width:1500px){main{max-width:1000px;margin-left:calc(290px + max(16px,(100vw - 290px - 1000px)/2))}body{font-size:17px}}
h1{font-size:24px;margin:10px 0 4px}h2{font-size:20px;margin:22px 0 8px}h4{margin:0 0 6px;font-size:16px}
.scope{display:inline-block;background:var(--bg-e7f6ef,#e7f6ef);color:var(--fg-065f46,#065f46);border-radius:6px;padding:3px 8px;font-size:12.5px;margin-bottom:6px}
.muted{color:var(--fg-6b7280,#6b7280);font-size:14.5px}
.card{background:var(--bg-fff,#fff);border:1px solid var(--bd-dde1e6,#dde1e6);border-radius:12px;padding:12px 14px;margin:10px 0;min-width:0}
.card ul,.card ol{padding-left:20px;margin:6px 0}.card li{margin:3px 0}
.note{background:var(--bg-fff7e6,#fff7e6);border-left:5px solid var(--bd-f59e0b,#f59e0b);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14.5px}
code{background:var(--bg-eef0f3,#eef0f3);border-radius:4px;padding:1px 4px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;overflow-wrap:anywhere}
pre.code-demo{background:var(--bg-282a35,#282a35);color:var(--fg-e6e6e6,#e6e6e6);border-radius:8px;padding:10px;overflow-x:auto;font-size:13px;margin:8px 0;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere}
table.t{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}table.t th,table.t td{border:1px solid var(--bd-d6dae0,#d6dae0);padding:5px 7px;text-align:left}table.t th{background:var(--bg-e7f6ef,#e7f6ef)}
.rule{background:var(--bg-eef6ff,#eef6ff);border-left:4px solid var(--bd-2563eb,#2563eb);padding:6px 10px;border-radius:6px;font-weight:600;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.links a{display:inline-flex;align-items:center;min-height:44px;padding:6px 12px;background:var(--bg-04aa6d,#04aa6d);color:var(--on-04aa6d,#fff);border-radius:22px;text-decoration:none;font-size:14px}
.links a.alt{background:var(--bg-fff,#fff);color:var(--fg-04aa6d,#04aa6d);border:2px solid var(--bd-04aa6d,#04aa6d)}
button,.btn{font:inherit;min-height:46px;padding:8px 16px;border-radius:8px;border:0;background:var(--bg-04aa6d,#04aa6d);color:var(--on-04aa6d,#fff);font-weight:600;cursor:pointer;touch-action:manipulation}
button.sec{background:var(--bg-e5e7eb,#e5e7eb);color:var(--fg-1f2933,#1f2933)}button.warn{background:var(--bg-d97706,#d97706)}button.big{width:100%;min-height:52px;font-size:17px}
button:disabled{opacity:.5}
/* W3Schools-style example box */
.ex{border:1px solid var(--bd-d6dae0,#d6dae0);border-radius:10px;background:var(--bg-fff,#fff);margin:14px 0;overflow:hidden;min-width:0}
.ex .hd{background:var(--bg-04aa6d,#04aa6d);color:var(--on-04aa6d,#fff);padding:7px 12px;font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ex .hd small{font-weight:500;opacity:.92;margin-left:auto;font-size:12px;background:rgba(0,0,0,.18);padding:2px 8px;border-radius:10px}
.ex .bd{padding:10px 12px;font-size:15.5px}
.ex.bug .hd{background:var(--bg-dc2626,#dc2626)}.ex.tryit .hd{background:var(--bg-7c3aed,#7c3aed)}
textarea.code{display:block;width:100%;background:var(--bg-f6f8fa,#f6f8fa);color:var(--fg-111,#111);border:1px solid var(--bd-cbd2d9,#cbd2d9);border-radius:6px;padding:10px;font:16px/1.45 ui-monospace,Menlo,Consolas,monospace;resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:4;min-height:90px}
.sym{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.sym button{min-height:44px;min-width:40px;flex:1 0 12%;padding:0;background:var(--bg-e5e7eb,#e5e7eb);color:var(--fg-111,#111);font:600 18px ui-monospace,Menlo,monospace}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>button{flex:1 1 120px}
pre.out{background:var(--bg-111827,#111827);color:var(--fg-e5e7eb,#e5e7eb);border-radius:6px;padding:10px;margin:8px 0 0;font-size:13.5px;overflow-x:auto;max-width:100%;white-space:pre}
pre.out.err{color:var(--fg-fecaca,#fecaca);background:var(--bg-3b0d0d,#3b0d0d);white-space:pre-wrap;overflow-wrap:anywhere}
.out-h{font-size:12px;color:var(--fg-6b7280,#6b7280);margin-top:8px;font-weight:700;letter-spacing:.05em}
img.plot{max-width:100%;height:auto;display:block;margin:8px 0;border:1px solid var(--bd-d6dae0,#d6dae0);border-radius:6px;background:var(--bg-fff,#fff)}
details.rev{margin:8px 0;background:var(--bg-fffbeb,#fffbeb);border:1px solid var(--bd-fcd34d,#fcd34d);border-radius:8px;padding:6px 10px}details.rev summary{min-height:40px;display:flex;align-items:center;font-weight:600}
details.hint{margin:8px 0;background:var(--bg-eff6ff,#eff6ff);border:1px solid var(--bd-93c5fd,#93c5fd);border-radius:8px;padding:0 10px}details.hint summary{min-height:44px;display:flex;align-items:center;font-weight:600}
.pbar{height:10px;background:var(--bg-e5e7eb,#e5e7eb);border-radius:6px;overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;background:var(--bg-04aa6d,#04aa6d);transition:width .3s}
/* quiz / lesson cards */
.qcard{background:var(--bg-fff,#fff);border:2px solid var(--bd-dde1e6,#dde1e6);border-radius:16px;padding:14px;margin:10px 0}
.qcard h3{margin:0 0 6px;font-size:18px}.qcard .q{font-size:17px;font-weight:600;margin:6px 0 10px}
.choice{display:block;width:100%;text-align:left;background:var(--bg-fff,#fff);color:var(--fg-1f2933,#1f2933);border:2px solid var(--bd-cbd2d9,#cbd2d9);min-height:50px;margin:8px 0;font-weight:500;font-size:16px;overflow-wrap:anywhere}
.choice.sel{border-color:var(--bd-2563eb,#2563eb);background:var(--bg-eff6ff,#eff6ff)}.choice.ok{border-color:var(--bd-16a34a,#16a34a);background:var(--bg-dcfce7,#dcfce7)}.choice.no{border-color:var(--bd-dc2626,#dc2626);background:var(--bg-fee2e2,#fee2e2)}
input.ans{width:100%;font-size:18px;padding:12px;border:2px solid var(--bd-cbd2d9,#cbd2d9);border-radius:10px;min-height:52px}
.fb{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}.fb.ok{background:var(--bg-dcfce7,#dcfce7);border:1px solid var(--bd-16a34a,#16a34a)}.fb.no{background:var(--bg-fee2e2,#fee2e2);border:1px solid var(--bd-dc2626,#dc2626)}.fb.info{background:var(--bg-e0f2fe,#e0f2fe);border:1px solid var(--bd-38bdf8,#38bdf8)}
.steps{margin:8px 0;padding:0;list-style:none;counter-reset:s}.steps li{counter-increment:s;background:var(--bg-f8fafc,#f8fafc);border:1px solid var(--bd-e2e8f0,#e2e8f0);border-radius:8px;padding:6px 10px 6px 34px;margin:5px 0;position:relative;animation:pop .25s}
.steps li:before{content:counter(s);position:absolute;left:8px;top:6px;background:var(--bg-2563eb,#2563eb);color:var(--on-2563eb,#fff);border-radius:50%;width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chips-o{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;min-height:52px}
.chipo{background:var(--bg-fff,#fff);border:2px solid var(--bd-cbd2d9,#cbd2d9);border-radius:10px;padding:8px 10px;font:14px ui-monospace,Menlo,monospace;min-height:44px;color:var(--fg-111,#111);overflow-wrap:anywhere;text-align:left}
.chipo.in{background:var(--bg-eff6ff,#eff6ff);border-color:var(--bd-2563eb,#2563eb)}
.slots{background:var(--bg-f8fafc,#f8fafc);border:2px dashed var(--bd-94a3b8,#94a3b8);border-radius:10px;padding:6px;min-height:60px;display:flex;flex-direction:column;gap:6px}
.vis{margin:8px 0;text-align:center}.vis svg{max-width:100%;height:auto}
.lessons{display:grid;gap:8px}
.lessons button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--bg-fff,#fff);color:var(--fg-1f2933,#1f2933);border:2px solid var(--bd-d6dae0,#d6dae0);min-height:62px;width:100%}
.lessons button b{display:block}.lessons button span.s{display:block;font-weight:400;color:var(--fg-6b7280,#6b7280);font-size:13px}.lessons .done{border-color:var(--bd-16a34a,#16a34a);background:var(--bg-f0fdf4,#f0fdf4)}
.loading{display:flex;gap:8px;align-items:center;color:var(--fg-6b7280,#6b7280);font-size:14px;margin:6px 0}
.spin{width:18px;height:18px;border:3px solid var(--bd-d1d5db,#d1d5db);border-top-color:var(--bd-04aa6d,#04aa6d);border-radius:50%;animation:sp 1s linear infinite;flex:none}@keyframes sp{to{transform:rotate(360deg)}}
.pager{display:flex;gap:8px;margin:20px 0}.pager a{flex:1;text-align:center;padding:12px;background:var(--bg-282a35,#282a35);color:var(--fg-fff,#fff);border-radius:10px;text-decoration:none;min-height:46px}
.home-grid{display:grid;grid-template-columns:1fr;gap:8px}.home-grid a{display:flex;gap:10px;align-items:center;background:var(--bg-fff,#fff);border:1px solid var(--bd-d6dae0,#d6dae0);border-radius:12px;padding:10px 12px;color:inherit;text-decoration:none;min-height:56px}
.home-grid a small{display:block;color:var(--fg-6b7280,#6b7280);font-size:12.5px}
.oos{background:var(--bg-fef2f2,#fef2f2);border:1px solid var(--bd-fca5a5,#fca5a5);border-radius:10px;padding:8px 12px;font-size:14px}

@media(max-width:480px){.brand span{display:none}.chip{padding:3px 6px;font-size:11.5px}#top{gap:6px}}
#top{overflow:hidden}.chips{min-width:0}

main{padding-bottom:calc(90px + env(safe-area-inset-bottom))}img,svg,pre,table,textarea{max-width:100%}.vis svg{height:auto}pre.out{-webkit-overflow-scrolling:touch}
@media(max-width:360px){h1{font-size:21px}.card{padding:10px}.links a{font-size:13px}}

/* ---- #TODO practice, dashboard, export/import ---- */
.ex.todo.easy .hd{background:var(--bg-16a34a,#16a34a)}.ex.todo.medium .hd{background:var(--bg-d97706,#d97706)}.ex.todo.hard .hd{background:var(--bg-dc2626,#dc2626)}.ex.todo.boss .hd{background:var(--bg-7c3aed,#7c3aed)}
.lvtabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px;margin:8px 0}
.lvtab{background:var(--bg-fff,#fff);color:var(--fg-1f2933,#1f2933);border:2px solid var(--bd-cbd2d9,#cbd2d9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:56px;padding:4px 6px;font-size:15px;line-height:1.2}
.lvtab span{font-size:12px;font-weight:500;color:var(--fg-6b7280,#6b7280)}
.lvtab.easy.on{background:var(--bg-dcfce7,#dcfce7);border-color:var(--bd-16a34a,#16a34a)}.lvtab.medium.on{background:var(--bg-fef3c7,#fef3c7);border-color:var(--bd-d97706,#d97706)}.lvtab.hard.on{background:var(--bg-fee2e2,#fee2e2);border-color:var(--bd-dc2626,#dc2626)}
.lvd{margin:2px 0 6px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.pill{min-width:48px;min-height:48px;padding:0;border-radius:50%;background:var(--bg-fff,#fff);color:var(--fg-1f2933,#1f2933);border:2px solid var(--bd-cbd2d9,#cbd2d9);font-size:17px}
.pill.on{border-color:var(--bd-2563eb,#2563eb);background:var(--bg-eff6ff,#eff6ff)}.pill.ok{background:var(--bg-16a34a,#16a34a);border-color:var(--bd-16a34a,#16a34a);color:var(--on-16a34a,#fff)}
.tdres{list-style:none;margin:6px 0;padding:0}.tdres li{border-radius:8px;padding:6px 10px;margin:5px 0;font-size:15px;overflow-wrap:anywhere}
.tdres li.ok{background:var(--bg-dcfce7,#dcfce7);border:1px solid var(--bd-86efac,#86efac)}.tdres li.no{background:var(--bg-fee2e2,#fee2e2);border:1px solid var(--bd-fca5a5,#fca5a5)}
.ex.todo .row>button{flex:1 1 130px}
.ex.todo textarea.code{min-height:150px}
.lockmsg{margin:2px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.stats div{background:var(--bg-fff,#fff);border:1px solid var(--bd-dde1e6,#dde1e6);border-radius:12px;padding:10px;text-align:center}.stats b{display:block;font-size:24px}.stats span{font-size:13px;color:var(--fg-6b7280,#6b7280)}
label.btn.filebtn{display:flex;align-items:center;justify-content:center;flex:1 1 130px;min-height:46px;padding:8px 16px;border-radius:8px;background:var(--bg-e5e7eb,#e5e7eb);color:var(--fg-1f2933,#1f2933);font-weight:600;cursor:pointer;position:relative;overflow:hidden}
label.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px}
textarea.code[readonly]{background:var(--bg-eef0f3,#eef0f3)}
#impTxt,#expTxt{word-break:break-all}
.solbox pre.out{max-height:420px;overflow:auto}
/* ---- v3: theory prep, worked probability, weak spots ---- */
.lvtab.boss.on{background:var(--bg-ede9fe,#ede9fe);border-color:var(--bd-7c3aed,#7c3aed)}
.thlist{display:grid;gap:6px;margin:10px 0}
.throw{display:flex;gap:10px;align-items:center;text-align:left;background:var(--bg-fff,#fff);color:var(--fg-1f2933,#1f2933);border:2px solid var(--bd-cbd2d9,#cbd2d9);min-height:52px;padding:6px 10px;font-size:15px;font-weight:500}
.throw small{display:block;font-weight:400;color:var(--fg-6b7280,#6b7280);font-size:13px}.throw.on{border-color:var(--bd-2563eb,#2563eb);background:var(--bg-eff6ff,#eff6ff)}.throw.ok{border-color:var(--bd-16a34a,#16a34a)}
.tpart{margin:14px 0;padding:10px 0;border-top:1px dashed var(--bd-cbd2d9,#cbd2d9)}.tpart:first-of-type{border-top:0}
textarea.tx{width:100%;box-sizing:border-box;min-height:140px;font:16px/1.45 system-ui,sans-serif;padding:10px;border:2px solid var(--bd-cbd2d9,#cbd2d9);border-radius:10px;resize:vertical}
.tcount{text-align:right;font-size:12px}
.pairs .pr{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px;border:2px solid var(--bd-e5e7eb,#e5e7eb);border-radius:10px;margin:6px 0}
.pairs .pr>span{flex:1 1 220px;overflow-wrap:anywhere}.pairs select{flex:1 1 220px;min-height:46px;font-size:16px;max-width:100%;padding:6px;border-radius:8px;border:2px solid var(--bd-cbd2d9,#cbd2d9);background:var(--bg-fff,#fff)}
.pairs .pr.ok{border-color:var(--bd-16a34a,#16a34a);background:var(--bg-f0fdf4,#f0fdf4)}.pairs .pr.no{border-color:var(--bd-dc2626,#dc2626);background:var(--bg-fef2f2,#fef2f2)}
.chipo.ok{border-color:var(--bd-16a34a,#16a34a);background:var(--bg-dcfce7,#dcfce7)}.chipo.no{border-color:var(--bd-dc2626,#dc2626);background:var(--bg-fee2e2,#fee2e2)}
.pstep{border:2px solid var(--bd-e5e7eb,#e5e7eb);border-radius:12px;padding:10px;margin:10px 0}.pstep.active{border-color:var(--bd-2563eb,#2563eb)}.pstep.ok{border-color:var(--bd-16a34a,#16a34a);background:var(--bg-f0fdf4,#f0fdf4)}.pstep.rev{border-color:var(--bd-d97706,#d97706);background:var(--bg-fffbeb,#fffbeb)}.pstep.lock{opacity:.55}
.pstep .pin{width:100%;box-sizing:border-box;font-size:17px;min-height:48px;margin:8px 0 4px}
.rulelist .choice{margin:5px 0}.flist{padding-left:18px}.flist li{margin:8px 0}.rule{font-family:ui-monospace,Menlo,monospace;color:var(--fg-1d4ed8,#1d4ed8);overflow-wrap:anywhere}
.why{margin:8px 0 0;padding-left:20px}
ul.weak{list-style:none;padding:0;margin:0}ul.weak li{padding:8px 0;border-top:1px solid var(--bd-e5e7eb,#e5e7eb);line-height:1.35}ul.weak li:first-child{border-top:0}
.pk button{min-width:44px}
/* ---- v3: exam mode ---- */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--bg-1f2933,#1f2933);color:var(--fg-fff,#fff);padding:10px 16px;border-radius:12px;max-width:90vw;z-index:80;opacity:0;pointer-events:none;transition:.2s;font-size:15px;text-align:center}#toast.on{opacity:1;transform:translateX(-50%)}

    if (i >= total) return done();
    const it = items[i]; att = 0; shown = 0; picked = null; seq = [];
    let h = head() + '<div class="qcard">';
    if (it.type === "learn") h += `<h3>${it.title}</h3>${it.html}${vis(it.vis)}<button class="big" data-q="next">Continue</button>`;
    else if (it.type === "code") { const sn = findSnip(it.snippet); h += `<h3>▶ ${esc(it.title)}</h3><p class="muted">${sn.desc}</p>${editor("q-" + sn.id, sn.code)}<button class="big sec" data-q="next">Continue</button>`; }
    else {

      if (it.type === "mcq") h += it.choices.map((c, k) => `<button class="choice" data-q="pick" data-k="${k}">${c}</button>`).join("");
      if (it.type === "num") h += `<input class="ans" inputmode="decimal" autocomplete="off" autocapitalize="off" placeholder="Type your answer (e.g. 0.25 or 1/4)">`;
      if (it.type === "fill") h += `<pre class="out" style="white-space:pre-wrap">${esc(it.code)}</pre><input class="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type what goes in the blank">`;
      if (it.type === "order") { pool = it.lines.map((l, k) => k).sort(() => Math.random() - .5); if (pool.every((v, k) => v === k)) pool.reverse(); h += `<div class="muted">Tap the lines in the right order. Tap a placed line to take it back.</div><div class="slots" data-r="slots"></div><div class="chips-o" data-r="pool"></div>`; }

      h += `<div class="fb-slot"></div><button class="big" data-q="check">Check</button>`;

  }

  }

/* ----- chat store: its own IndexedDB so progress storage is never touched ----- */
const CHAT = { msgs: [], db: null, ok: false, loaded: null };
function chatOpenDB() { return new Promise((res, rej) => { if (!window.indexedDB) return rej(new Error("no IndexedDB")); const r = indexedDB.open("ml600chat", 1); r.onupgradeneeded = () => r.result.createObjectStore("msgs", { keyPath: "id" }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
CHAT.load = () => CHAT.loaded || (CHAT.loaded = chatOpenDB().then(db => { CHAT.db = db; CHAT.ok = true; return new Promise(res => { const q = db.transaction("msgs").objectStore("msgs").getAll(); q.onsuccess = () => { CHAT.msgs = (q.result || []).sort((a, b) => a.ts - b.ts); res(); }; q.onerror = () => res(); }); }).catch(() => { CHAT.ok = false; }));
CHAT.add = m => { m.id = m.ts + "-" + Math.random().toString(36).slice(2, 7); CHAT.msgs.push(m); if (CHAT.db) try { CHAT.db.transaction("msgs", "readwrite").objectStore("msgs").put(m); } catch (e) {} return m; };
CHAT.clear = () => { CHAT.msgs = []; if (CHAT.db) try { CHAT.db.transaction("msgs", "readwrite").objectStore("msgs").clear(); } catch (e) {} };
const chatBubble = m => `<div class="cbub ${m.role === "me" ? "me" : "li"}"><div class="cwho">${m.role === "me" ? "You" : "💛 Celeste"} · ${new Date(m.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}${m.page ? ` · ${esc(m.page)}` : ""}</div><div class="ctxt">${esc(m.text)}</div></div>`;
function chatHTML() {
  const exam = !!examCur();
  return `<div id="liChat" class="chatlog" role="log" aria-live="polite">${CHAT.msgs.length ? CHAT.msgs.map(chatBubble).join("") : `<div class="cbub li"><div class="ctxt">Hi Shivaar 💛 Type a question or paste your thinking, tap Send, and I'll copy a ready-made message (with this page, your code or working, and your progress). Paste it to me in the Grok Bot chat, then bring my reply back here with “Paste Celeste's reply”.</div></div>`}</div>
  ${CHAT.ok === false && CHAT.loaded ? `<div class="muted" style="font-size:12px">Chat history can't be saved in this browser mode (private window?). It will last until you close the page.</div>` : ""}
  ${exam ? `<div class="note" style="margin:6px 0">The mock exam is running, so chat is paused until you submit. 💛</div>` : ""}
  <div id="liReplyBox" hidden><textarea id="liReply" rows="4" placeholder="Paste Celeste's reply here" autocomplete="off" spellcheck="true"></textarea><div class="liacts"><button type="button" data-fx="chatreplyadd">Add as Celeste bubble</button><button type="button" class="sec" data-fx="chatreplycancel">Cancel</button></div></div>
  <textarea id="liIn" rows="3" placeholder="Message Celeste…" autocomplete="off" autocapitalize="sentences" enterkeyhint="enter" ${exam ? "disabled" : ""} aria-label="Message to Celeste"></textarea>
  <div class="liacts"><button type="button" data-fx="chatsend" ${exam ? "disabled" : ""}>➤ Send (copies)</button><button type="button" class="sec" data-fx="chatpaste" ${exam ? "disabled" : ""}>📥 Paste Celeste's reply</button></div>
  <button type="button" class="sec chatclr" data-fx="chatclear">🗑 Clear chat history</button>`;
}
function pageName() { const h = $("#main h1"), id = currentId(); const t = h ? h.textContent.replace(/\s+/g, " ").trim() : (document.title || "ML600 Practice Lab"); return id ? `${t} › ${infoOf(id).title || id}` : t; }
function chatBlock(msg) {
  const id = currentId(); let ctx = "";
  if (id) { const t = askText(id), i = t.indexOf("\n\nPROGRESS SO FAR"); ctx = (i > 0 ? t.slice(0, i) : t) + "\n\n"; }
  return `MESSAGE FROM SHIVAAR (ML600 Practice Lab):\n${msg}\n\nCURRENT PAGE: ${pageName()}\n\n${ctx}${progressSummary()}\n\nPlease reply to my message${id ? " (and give FEEDBACK + MODEL ANSWER for my answer above)" : ""}.`;
}
function chatRefresh() { const l = $("#liChat"); if (l) { l.innerHTML = CHAT.msgs.map(chatBubble).join(""); l.scrollTop = l.scrollHeight; } }
function liTab(t) { LI().tab = t; $("#liTabBuddy") && ($("#liTabBuddy").hidden = t !== "buddy"); $("#liTabChat") && ($("#liTabChat").hidden = t !== "chat"); $$("[data-fx=litab]").forEach(b => { b.classList.toggle("on", b.dataset.t === t); b.setAttribute("aria-selected", b.dataset.t === t); }); if (t === "chat") { const l = $("#liChat"); if (l) l.scrollTop = l.scrollHeight; } }
window.__V3.chat = { CHAT, chatBlock, liTab };
document.addEventListener("click", async e => {

    CHAT.add({ ts: Date.now() + 1, role: "li", sys: 1, text: ok ? "Copied! Paste it to me in the Grok Bot chat and I'll reply there." : "I couldn't copy automatically. Long-press the box above to select your message, or use Export instead." }); chatRefresh();
    if (voiceOn() && ok) speakText("Copied! Paste it to me in the Grok Bot chat and I'll reply there.");
  }
  else if (f === "chatpaste") { $("#liReplyBox").hidden = false; const t = $("#liReply"); try { if (navigator.clipboard && navigator.clipboard.readText) { const c = await navigator.clipboard.readText(); if (c && !t.value) t.value = c; } } catch (er) {} t.focus(); }
  else if (f === "chatreplycancel") { $("#liReply").value = ""; $("#liReplyBox").hidden = true; }
  else if (f === "chatreplyadd") { const t = $("#liReply"), v = t.value.trim(); if (!v) { t.focus(); return; } CHAT.add({ ts: Date.now(), role: "li", text: v, page: pageName() }); t.value = ""; $("#liReplyBox").hidden = true; chatRefresh(); if (voiceOn()) speakText(v); }
  else if (f === "chatclear") { if (confirm("Delete the chat history on this device?")) { CHAT.clear(); chatRefresh(); } }
});

window.__V3.map = { MAP, REELS, MIXQ, MIX_ALL, mixNumOk, LINK_VAIA_SET, LINK_NB_SET };

/* ===== v3 · part 11: same-origin self-update on rawcdn.githack (keeps progress) ===== */
const UPD_REPO = "Shiv0130/ml600-practice-lab";
const UPD_HOST = "rawcdn.githack.com";
const UPD_TTL = 5 * 60 * 1000;
const UPD_LS = "ml600lab.updateCache";
const UPD_REDIR = "ml600lab.updateRedirected";
const UPD_TOAST = "ml600lab.justUpdated";

function updShasEqual(a, b) {
  if (!a || !b) return false;
  const x = String(a).toLowerCase(), y = String(b).toLowerCase();
  return x === y || x.startsWith(y) || y.startsWith(x);
}
function updDecide(p) {
  const ownId = p && p.ownId, remoteId = p && p.remoteId, latestSha = p && p.latestSha, currentSha = p && p.currentSha;
  if (!ownId || !remoteId || ownId === remoteId) return { action: "stay" };
  if (p && p.alreadyRedirectedFor === ownId) return { action: "stop" };
  if (!latestSha || !/^[0-9a-f]{7,40}$/i.test(latestSha)) return { action: "stay" };
  if (currentSha && updShasEqual(latestSha, currentSha)) return { action: "stay" };
  return { action: "redirect", sha: latestSha };
}
function updCurrentSha(pathname) {
  const m = String(pathname || "").match(/\/Shiv0130\/ml600-practice-lab\/([0-9a-f]{7,40})\//i);
  return m ? m[1] : null;
}
function updDest(sha, hash) {
  return "https://" + UPD_HOST + "/" + UPD_REPO + "/" + sha + "/index.html" + (hash || "");
}
function updCacheGet() {
  try {
    const o = JSON.parse(localStorage.getItem(UPD_LS) || "null");
    if (o && o.ts && (Date.now() - o.ts) < UPD_TTL) return o;
  } catch (e) {}
  return null;
}
function updCacheSet(o) {
  try { localStorage.setItem(UPD_LS, JSON.stringify(Object.assign({}, o, { ts: Date.now() }))); } catch (e) {}
}
function updShouldRun() {
  if (typeof window !== "undefined" && window.__UPD_FORCE) return true;
  return location.hostname === UPD_HOST;
}
function updShowToast() {
  try {
    if (sessionStorage.getItem(UPD_TOAST) === "1") {
      sessionStorage.removeItem(UPD_TOAST);
      if (typeof toast === "function") toast("Updated to latest ✓", 4000);
    }
  } catch (e) {}
}
async function updFetchJson(url) {
  // cross-origin requests must stay "simple" (no cache option / custom headers): those add Cache-Control, which GitHub's CORS preflight rejects. A ?t= buster is used instead.
  const r = /^https?:/.test(url) ? await fetch(url) : await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}
async function updOwnId() {
  const j = await updFetchJson("./version.json");
  return j && j.id ? j.id : null;
}
async function updRemote(bust) {
  if (!bust) {
    const c = updCacheGet();
    if (c && c.remoteId) return c;
  }
  const url = "https://raw.githubusercontent.com/" + UPD_REPO + "/main/version.json?t=" + Date.now();
  const j = await updFetchJson(url);
  let sha = (j && (j.sha || j.commit)) ? (j.sha || j.commit) : null;
  if (sha && !/^[0-9a-f]{7,40}$/i.test(sha)) sha = null;
  const o = { remoteId: j && j.id ? j.id : null, sha: sha };
  if (!o.remoteId) return null;
  updCacheSet(o);
  return o;
}
async function updLatestSha() {
  // SHA comes from version.json (filled at publish). Never call api.github.com (CORS-blocked).
  const c = updCacheGet();
  if (c && c.sha && /^[0-9a-f]{7,40}$/i.test(c.sha)) return c.sha;
  const url = "https://rawcdn.githack.com/" + UPD_REPO + "/main/version.json?t=" + Date.now();
  const r = await fetch(url);
  if (!r.ok) throw new Error(String(r.status));
  const j = await r.json();
  let sha = (j && (j.sha || j.commit)) ? (j.sha || j.commit) : null;
  if (!sha) {
    const m = String(r.url || "").match(/\/([0-9a-f]{7,40})\//i);
    sha = m ? m[1] : null;
  }
  if (!sha || !/^[0-9a-f]{7,40}$/i.test(sha)) return null;
  const prev = (() => { try { return JSON.parse(localStorage.getItem(UPD_LS) || "null"); } catch (e) { return null; } })() || {};
  updCacheSet({ remoteId: prev.remoteId || (j && j.id) || null, sha: sha });
  return sha;
}
function updGo(url) {
  const hook = window.__V3 && window.__V3.update && window.__V3.update.go;
  if (typeof hook === "function") return hook(url);
  location.replace(url);
}
async function updCheck() {
  try { updShowToast(); } catch (e) {}
  if (!updShouldRun()) return { action: "skip" };
  try {
    const ownId = await updOwnId();
    let already = null;
    try { already = sessionStorage.getItem(UPD_REDIR); } catch (e) {}
    const remote = await updRemote(false);
    if (!ownId || !remote || !remote.remoteId) return { action: "stay" };
    let sha = remote.sha || null;
    const preview = updDecide({
      ownId, remoteId: remote.remoteId, latestSha: sha || "0123456789abcdef", currentSha: updCurrentSha(location.pathname), alreadyRedirectedFor: already
    });
    // If ids match we can stay without hitting the commits API.
    if (ownId === remote.remoteId) return { action: "stay" };
    if (preview.action === "stop") return { action: "stop" };
    if (!sha) sha = await updLatestSha();
    const decision = updDecide({
      ownId, remoteId: remote.remoteId, latestSha: sha, currentSha: updCurrentSha(location.pathname), alreadyRedirectedFor: already
    });
    if (decision.action === "redirect") {
      try {
        sessionStorage.setItem(UPD_REDIR, ownId);
        sessionStorage.setItem(UPD_TOAST, "1");
      } catch (e) {}
      updGo(updDest(decision.sha, location.hash || ""));
    }
    return decision;
  } catch (e) {
    return { action: "stay" };  // offline, 429, CORS, etc. — fail silently
  }
}

function updAttach() {
  window.__V3 = window.__V3 || {};
  window.__V3.update = { check: updCheck, decide: updDecide, dest: updDest, currentSha: updCurrentSha, cacheKey: UPD_LS, ttl: UPD_TTL };
}
updAttach();
if (typeof FX !== "undefined") FX.boot.push(() => { updAttach(); updCheck(); setInterval(updCheck, UPD_TTL); });
